        type: string
      created_at:
        type: string
      id:
        type: integer
      is_critical:
        description: маркер того, что проблему надо решать срочно и через звонок
        type: boolean
      reasons:
        items:
          $ref: '#/definitions/maxito_internal_models.Reason'
        type: array
      title:
        type: string
    type: object
  maxito_internal_models.Reason:
    properties:
      allows_notification:
        description: |-
          AllowsNotification — можно ли использовать эту причину при создании
          уведомления диспетчером (не при создании обращения жителем — там
          ограничений нет). Отсекает абсурдные для планового уведомления
          причины вроде "грязный лифт" — уведомление должно быть про то, что
          можно заранее анонсировать (отключение, неработоспособность), а не
          про жалобу на текущее состояние.
        type: boolean
      code:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_other:
        type: boolean
      problem_type_id:
        type: integer
      title:
        type: string
    type: object
