basePath: /api/v1
definitions:
  apidoc.ErrorResponse:
    properties:
      code:
        description: |-
          Code — машиночитаемый код ошибки; присутствует только у части
          эндпоинтов (см. описание конкретного эндпоинта), у остальных отсутствует.
        example: bad_request
        type: string
      error:
        example: invalid request
        type: string
    type: object
  internal_handlers_bot.bindRequest:
    properties:
      max_user_id:
        description: |-
          json.Number принимает и число, и строку с числом — бот может прислать
          max_user_id любым из способов, результат один и тот же.
        type: string
      phone:
        type: string
    required:
    - max_user_id
    - phone
    type: object
  internal_handlers_bot.bindResponse:
    properties:
      full_name:
        type: string
      id:
        type: integer
      role:
        example: resident
        type: string
    type: object
  internal_handlers_bot.demoRegisterRequest:
    properties:
      code_word:
        type: string
      full_name:
        type: string
      max_user_id:
        type: string
      phone:
        type: string
      role:
        type: string
    required:
    - code_word
    - full_name
    - max_user_id
    - phone
    - role
    type: object
  internal_handlers_bot.demoSwitchRoleRequest:
    properties:
      max_user_id:
        type: string
      role:
        type: string
    required:
    - max_user_id
    - role
    type: object
  internal_handlers_bot.demoUserResponse:
    properties:
      full_name:
        type: string
      id:
        type: integer
      role:
        example: resident
        type: string
    type: object
  internal_handlers_bot.demoVerifyRequest:
    properties:
      code_word:
        type: string
    required:
    - code_word
    type: object
  internal_handlers_common.DispatcherInfo:
    properties:
      houses_count:
        type: integer
    type: object
  internal_handlers_common.MeResponse:
    properties:
      dispatcher:
        $ref: '#/definitions/internal_handlers_common.DispatcherInfo'
      full_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_demo:
        description: |-
          IsDemo — аккаунт создан через вход по кодовому слову (для жюри), не
          через обычную регистрацию. Фронт/бот по нему решает, показывать ли
          кнопку "Сменить роль".
        type: boolean
      phone:
        type: string
      resident:
        allOf:
        - $ref: '#/definitions/internal_handlers_common.ResidentInfo'
        description: Заполняется только для соответствующей роли, у остальных отсутствует
          в JSON.
      role:
        $ref: '#/definitions/maxito_internal_models.Role'
    type: object
  internal_handlers_common.ResidentInfo:
    properties:
      apartment:
        type: string
      entrance_number:
        type: integer
      house_id:
        type: integer
    type: object
  internal_handlers_common.loginRequest:
    properties:
      init_data:
        description: InitData — значение window.WebApp.initData, строка целиком, без
          изменений.
        type: string
    required:
    - init_data
    type: object
  internal_handlers_common.loginResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/internal_handlers_common.loginUser'
    type: object
  internal_handlers_common.loginUser:
    properties:
      full_name:
        type: string
      id:
        type: integer
      role:
        example: resident
        type: string
    type: object
  internal_handlers_common.uploadResponse:
    properties:
      url:
        example: https://host/uploads/ab12cd34.jpg
        type: string
    type: object
  internal_handlers_dispatcher.ChangeStatusRequest:
    properties:
      comment:
        type: string
      photo_url:
        type: string
      status:
        $ref: '#/definitions/maxito_internal_models.AppealStatus'
    required:
    - comment
    - status
    type: object
  internal_handlers_dispatcher.CreateNotificationRequest:
    properties:
      body:
        type: string
      ends_at:
        description: RFC3339
        type: string
      entrance_number:
        type: integer
      house_id:
        type: integer
      problem_type_id:
        type: integer
      reason_id:
        description: не нужен, если тема — "Другое"
        type: integer
      scope:
        description: '"house" | "entrance"'
        type: string
      starts_at:
        description: RFC3339
        type: string
      title:
        type: string
    required:
    - body
    - ends_at
    - house_id
    - problem_type_id
    - scope
    - starts_at
    type: object
  internal_handlers_dispatcher.appealListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/maxito_internal_services.AppealListItem'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  internal_handlers_representative.AssignHousesRequest:
    properties:
      house_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - house_ids
    type: object
  internal_handlers_representative.CreateDispatcherRequest:
    properties:
      full_name:
        type: string
      phone:
        type: string
    required:
    - full_name
    - phone
    type: object
  internal_handlers_representative.CreateHouseRequest:
    properties:
      address:
        type: string
      chat_invite_link:
        description: необязательно
        type: string
      construction_year:
        description: необязательно
        type: integer
      entrances_count:
        minimum: 1
        type: integer
      floors_count:
        description: необязательно
        type: integer
      number:
        type: string
    required:
    - address
    - entrances_count
    type: object
  internal_handlers_representative.UpdateCompanyRequest:
    properties:
      contact_phone:
        type: string
      dispatcher_phone:
        type: string
      email:
        type: string
      full_name:
        type: string
      short_name:
        type: string
      website:
        type: string
    required:
    - full_name
    type: object
  internal_handlers_representative.UpdateHouseRequest:
    properties:
      address:
        type: string
      chat_invite_link:
        type: string
      construction_year:
        type: integer
      entrances_count:
        type: integer
      floors_count:
        type: integer
      number:
        type: string
    type: object
  internal_handlers_resident.CreateAppealRequest:
    properties:
      description:
        type: string
      discovered_at:
        description: необязательно, RFC3339
        type: string
      entrance_number:
        type: integer
      importance:
        type: string
      photo_urls:
        description: ссылки, полученные заранее через POST /upload
        items:
          type: string
        type: array
      problem_type_id:
        type: integer
      reason_id:
        description: не нужен, если тема — "Другое"
        type: integer
      wants_recalculation:
        type: boolean
    required:
    - description
    - problem_type_id
    type: object
  internal_handlers_resident.chatLinkResponse:
