schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: JWT, полученный через POST /auth/max. Передавать как "Bearer &lt;token&gt;".
      Для локальной отладки без MAX бэкенд также принимает X-Max-User-Id (+X-Max-User-Phone
      при первой привязке), если на сервере включён ALLOW_DEV_HEADERS.
    in: header
    name: Authorization
    type: apiKey
  InternalKey:
    description: Общий секрет между сервером бота и бэкендом — только для /internal/*.
    in: header
    name: X-Internal-Key
    type: apiKey
swagger: "2.0"
