          $ref: '#/definitions/maxito_internal_services.AppealListItem'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  maxito_internal_models.Appeal:
    properties:
      attachments:
        items:
          $ref: '#/definitions/maxito_internal_models.AppealAttachment'
        type: array
      author:
        $ref: '#/definitions/maxito_internal_models.User'
      author_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      discovered_at:
        description: когда житель заметил проблему (необязательно)
        type: string
      entrance_number:
        description: null = весь дом
        type: integer
      house:
        $ref: '#/definitions/maxito_internal_models.House'
      house_id:
        type: integer
      id:
        type: integer
      importance:
        $ref: '#/definitions/maxito_internal_models.Importance'
      problem_type:
        $ref: '#/definitions/maxito_internal_models.ProblemType'
      problem_type_id:
        type: integer
      reason:
        $ref: '#/definitions/maxito_internal_models.Reason'
      reason_id:
        type: integer
      status:
        $ref: '#/definitions/maxito_internal_models.AppealStatus'
      status_changes:
        items:
          $ref: '#/definitions/maxito_internal_models.AppealStatusChange'
        type: array
      subscriptions:
        items:
          $ref: '#/definitions/maxito_internal_models.AppealSubscription'
        type: array
      updated_at:
        type: string
      wants_recalculation:
        type: boolean
    type: object
  maxito_internal_models.AppealAttachment:
    properties:
      appeal_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      url:
        type: string
    type: object
  maxito_internal_models.AppealStatus:
