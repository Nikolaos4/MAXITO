host: localhost:8080
info:
  contact:
    name: MAXITO
  description: |-
    Бэкенд «Умного города» — обращения жителей МКД к управляющей компании, плановые работы, справочники домов/УК/аварийных служб. Один инстанс = одна УК.

    Роли: representative (представитель УК), dispatcher (диспетчер), resident (житель). Роль определяется самим пользователем на бэкенде — в запросах отдельно не передаётся.
  license:
    name: MIT
  title: MAXITO API
  version: "1.0"
paths:
  /auth/max:
    post:
      consumes:
      - application/json
      operationId: authLoginByMax
      parameters:
      - description: initData из window.WebApp.initData, как есть
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_common.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_common.loginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: invalid_init_data | init_data_expired
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "403":
          description: not_bound | inactive
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "503":
          description: auth_not_configured
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      summary: Вход из мини-приложения (initData -> JWT)
      tags:
      - auth
  /dispatcher/appeals:
    get:
      operationId: dispatcherListAppeals
      parameters:
      - collectionFormat: multi
        description: ID домов, можно повторять
        in: query
        items:
          type: integer
        name: house_id
        type: array
      - collectionFormat: multi
        description: accepted|in_progress|completed|rejected, можно повторять
        in: query
        items:
          type: string
        name: status
        type: array
      - collectionFormat: csv
        description: можно повторять
        in: query
        items:
          type: integer
        name: entrance_number
        type: array
      - collectionFormat: csv
        description: можно повторять
        in: query
        items:
          type: integer
        name: problem_type_id
        type: array
      - description: по умолчанию 1
        in: query
        name: page
        type: integer
      - description: по умолчанию 20, максимум 100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_dispatcher.appealListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список обращений по своим домам
      tags:
      - dispatcher-appeals
  /dispatcher/appeals/{id}:
    get:
      operationId: dispatcherGetAppeal
      parameters:
      - description: ID обращения
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/maxito_internal_services.AppealDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "404":
          description: чужой дом или обращение не найдено
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Карточка обращения
      tags:
      - dispatcher-appeals
  /dispatcher/appeals/{id}/status:
    post:
      consumes:
      - application/json
      description: 'Разрешённые переходы: accepted->in_progress|rejected, in_progress->completed|rejected.
        completed/rejected — конечные. photo_url принимается только при переходе в
        completed, иначе 400.'
      operationId: dispatcherChangeStatus
      parameters:
      - description: ID обращения
        in: path
        name: id
        required: true
        type: integer
      - description: Новый статус, комментарий (обязателен), фото — только для completed
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_dispatcher.ChangeStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/maxito_internal_models.AppealStatusChange'
        "400":
          description: недопустимый переход | нет комментария | photo_url не при completed
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Сменить статус обращения
      tags:
      - dispatcher-appeals
  /dispatcher/appeals/stats:
    get:
      operationId: dispatcherUnprocessedStats
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/maxito_internal_services.HouseAppealStats'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Статистика необработанных обращений по домам
      tags:
      - dispatcher-appeals
  /dispatcher/appeals/top:
    get:
      operationId: dispatcherTopAppeals
      parameters:
      - description: по умолчанию 5, максимум 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/maxito_internal_services.AppealListItem'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Топ обращений по лайкам
      tags:
      - dispatcher-appeals
  /dispatcher/company:
    get:
      description: Одна запись на весь инстанс, не привязана к дому. Если Представитель
        ещё не заполнил — пустой объект "{}", не ошибка.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/maxito_internal_models.Company'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Реквизиты управляющей компании
      tags:
      - company-emergency
  /dispatcher/emergency-services:
    get:
      description: Общий на всю систему список, не привязан к дому.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/maxito_internal_models.EmergencyService'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список аварийных служб
      tags:
      - company-emergency
  /dispatcher/houses:
    get:
      operationId: dispatcherListHouses
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/maxito_internal_models.House'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Дома диспетчера
      tags:
      - dispatcher-houses
  /dispatcher/houses/{house_id}:
    get:
      operationId: dispatcherGetHouse
      parameters:
      - description: ID дома
        in: path
        name: house_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/maxito_internal_models.House'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "404":
          description: не найден или чужой дом
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Карточка одного дома
      tags:
      - dispatcher-houses
  /dispatcher/houses/{house_id}/entrances:
    get:
      operationId: dispatcherListEntrances
      parameters:
      - description: ID дома
        in: path
        name: house_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: integer
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Номера подъездов дома
      tags:
      - dispatcher-houses
  /dispatcher/notifications:
    get:
      operationId: dispatcherListNotifications
      parameters:
      - collectionFormat: csv
        description: можно повторять
        in: query
        items:
          type: integer
        name: house_id
        type: array
      - description: active | expired | revoked, не указан — все
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/maxito_internal_models.Notification'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Уведомления (плановые работы) по своим домам
      tags:
      - dispatcher-notifications
    post:
      consumes:
      - application/json
      description: reason_id обязателен, если тема не "Другое". Причина должна быть
        годной для уведомления (allows_notification=true у неё) — см. GET .../problem-types/{id}/reasons?for=notification.
      operationId: dispatcherCreateNotification
      parameters:
      - description: Дом/подъезд, тема+причина, текст, период действия
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_dispatcher.CreateNotificationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/maxito_internal_models.Notification'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Опубликовать плановые работы (уведомление)
      tags:
      - dispatcher-notifications
  /dispatcher/notifications/{id}/revoke:
    post:
      operationId: dispatcherRevokeNotification
      parameters:
      - description: ID уведомления
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: нет содержимого
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Досрочно отозвать уведомление
      tags:
      - dispatcher-notifications
  /dispatcher/problem-types:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/maxito_internal_models.ProblemType'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список тем обращений/уведомлений
      tags:
      - reference
  /dispatcher/problem-types/{id}/reasons:
    get:
      parameters:
      - description: ID темы (problem_type_id)
        in: path
        name: id
        required: true
        type: integer
      - description: notification — только причины, годные для уведомления
        in: query
        name: for
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/maxito_internal_models.Reason'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список причин для темы
      tags:
      - reference
  /internal/bind:
    post:
      consumes:
      - application/json
      description: Только для сервера бота, требует X-Internal-Key вместо обычного
        JWT.
      operationId: botBind
      parameters:
      - description: Телефон + max_user_id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_bot.bindRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_bot.bindResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: неверный или отсутствующий X-Internal-Key
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "403":
          description: 'code: inactive'
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "404":
          description: 'code: phone_not_registered'
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "409":
          description: 'code: conflict — телефон/max_user_id уже привязаны к другому
            аккаунту'
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - InternalKey: []
      summary: Привязать max_user_id к пользователю по телефону
      tags:
      - internal
  /internal/demo-register:
    post:
      consumes:
      - application/json
      description: Только для сервера бота, требует X-Internal-Key. Не для обычных
        пользователей — обход проверки телефона в БД.
      operationId: botDemoRegister
      parameters:
      - description: Кодовое слово, роль, ФИО, телефон, max_user_id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_bot.demoRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_bot.demoUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: 'code: wrong_code_word'
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "409":
          description: 'code: phone_taken'
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "503":
          description: 'code: demo_disabled'
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - InternalKey: []
      summary: Регистрация демо-аккаунта по кодовому слову
      tags:
      - internal
  /internal/demo-switch-role:
    post:
      consumes:
      - application/json
      description: Только для сервера бота, требует X-Internal-Key. Доступно только
        аккаунтам, созданным через кодовое слово.
      operationId: botDemoSwitchRole
      parameters:
      - description: max_user_id, новая роль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_bot.demoSwitchRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_bot.demoUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "403":
          description: 'code: not_demo_account'
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "503":
          description: 'code: demo_disabled'
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - InternalKey: []
      summary: Сменить роль демо-аккаунта
      tags:
      - internal
  /internal/demo-verify-code:
    post:
      consumes:
      - application/json
      description: Только для сервера бота, требует X-Internal-Key. Ничего не создаёт
        — просто проверка.
      operationId: botDemoVerifyCode
      parameters:
      - description: Кодовое слово
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_bot.demoVerifyRequest'
      produces:
      - application/json
      responses:
        "204":
          description: слово верное
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: 'code: wrong_code_word'
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "503":
          description: 'code: demo_disabled'
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - InternalKey: []
      summary: Проверить кодовое слово демо-входа
      tags:
      - internal
  /me:
    get:
      operationId: commonMe
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_common.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Текущий пользователь
      tags:
      - me
  /representative/assignments:
    get:
      operationId: representativeListAssignments
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/maxito_internal_models.DispatcherHouse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Все назначения диспетчер-дом
      tags:
      - representative-assignments
  /representative/company:
    get:
      description: Одна запись на весь инстанс, не привязана к дому. Если Представитель
        ещё не заполнил — пустой объект "{}", не ошибка.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/maxito_internal_models.Company'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Реквизиты управляющей компании
      tags:
      - company-emergency
    put:
      consumes:
      - application/json
      operationId: representativeUpdateCompany
      parameters:
      - description: Реквизиты; full_name обязателен, остальное — нет
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_representative.UpdateCompanyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/maxito_internal_models.Company'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Задать/поправить реквизиты УК
      tags:
      - representative-company
  /representative/dispatchers:
    get:
      operationId: representativeListDispatchers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/maxito_internal_models.User'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список диспетчеров
      tags:
      - representative-dispatchers
    post:
      consumes:
      - application/json
      operationId: representativeCreateDispatcher
      parameters:
      - description: ФИО и телефон
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_representative.CreateDispatcherRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/maxito_internal_models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Добавить диспетчера
      tags:
      - representative-dispatchers
  /representative/dispatchers/{dispatcher_id}/houses:
    get:
      operationId: representativeListDispatcherHouses
      parameters:
      - description: ID диспетчера
        in: path
        name: dispatcher_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/maxito_internal_models.House'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
