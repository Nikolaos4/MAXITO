      updated_at:
        type: string
      website:
        type: string
    type: object
  maxito_internal_models.DispatcherHouse:
    properties:
      assigned_at:
        type: string
      assigned_by:
        description: Representative who assigned
        type: integer
      assigner:
        $ref: '#/definitions/maxito_internal_models.User'
      dispatcher:
        $ref: '#/definitions/maxito_internal_models.User'
      dispatcher_id:
        type: integer
      house:
        $ref: '#/definitions/maxito_internal_models.House'
