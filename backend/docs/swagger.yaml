        type: integer
      id:
        type: integer
      notifications:
        items:
          $ref: '#/definitions/maxito_internal_models.Notification'
        type: array
      number:
        type: string
      residents:
        items:
          $ref: '#/definitions/maxito_internal_models.Resident'
        type: array
      updated_at:
        type: string
    type: object
