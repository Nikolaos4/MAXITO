server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Одно приложение на обе роли — какое дерево рендерить, решает Root.tsx
    # на клиенте (по start_param диплинка или по /me), не nginx.
    location = / {
        try_files /index.html =404;
    }

    # Бэкенд — тот же приём, что и dev-прокси Vite: относительный путь /api
    # уходит на backend внутри docker-сети, фронту не нужно знать домен бэка.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
