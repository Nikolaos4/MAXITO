name: Docker build & publish

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bot: 'bot/**'
            frontend: 'frontend/**'
            backend: 'backend/**'

      - name: Build matrix
        id: matrix
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' }}
          BOT: ${{ steps.filter.outputs.bot }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          BACKEND: ${{ steps.filter.outputs.backend }}
        run: |
          items=()
          for s in bot frontend backend; do
            v=${s^^}; v=${!v}
            if [ "$ALL" = "true" ] || [ "$v" = "true" ]; then
              items+=("{\"name\":\"$s\",\"context\":\"./$s\"}")
            fi
          done
          echo "matrix=[$(IFS=,; echo "${items[*]}")]" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api/v1' }}
            VITE_USE_MOCK=${{ vars.VITE_USE_MOCK || 'false' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Ping Portainer redeploy webhook
        if: success()
        env:
          WEBHOOK_URL: ${{ matrix.name == 'bot' && secrets.PORTAINER_BOT_WEBHOOK || matrix.name == 'frontend' && secrets.PORTAINER_FRONTEND_WEBHOOK || secrets.PORTAINER_BACKEND_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Webhook for ${{ matrix.name }} is not configured, skipping."
            exit 0
          fi
          curl -fsS -X POST --max-time 10 "$WEBHOOK_URL" > /dev/null \
            && echo "Portainer webhook triggered for ${{ matrix.name }}." \
            || echo "Portainer webhook ping failed for ${{ matrix.name }}, ignoring."
